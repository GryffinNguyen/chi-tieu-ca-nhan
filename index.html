<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chi Tiêu Hybrid Pro</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --card2: #1e293b;
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --sub: #94a3b8;
      --blue: #3b82f6;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER */
    .app-header {
      padding: calc(env(safe-area-inset-top, 14px) + 8px) 16px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .logo-badge { width: 36px; height: 36px; border-radius: 10px; background: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #fff; }
    .app-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .offline-pill { font-size: 10px; background: rgba(16,185,129,0.18); color: var(--green); padding: 2px 6px; border-radius: 6px; font-weight: 600; }
    .app-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; }

    /* MAIN SCROLL VIEW */
    .main-view { flex: 1; overflow-y: auto; padding: 14px 16px 105px; }
    .tab-page { display: none; flex-direction: column; gap: 14px; }
    .tab-page.active { display: flex; }

    /* CARDS */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .card-title { font-size: 14.5px; font-weight: 700; color: var(--text); }
    .card-sub { font-size: 11.5px; color: var(--sub); margin-top: 2px; }

    /* HERO SAFE TO SPEND */
    .hero-card { background: linear-gradient(145deg, #172036, #111827); border: 1px solid rgba(59,130,246,0.22); }
    .s2s-amount { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; margin: 6px 0; }
    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; background: rgba(16,185,129,0.15); color: var(--green); white-space: nowrap; }
    .pacing-box { background: rgba(0,0,0,0.28); border-radius: 14px; padding: 12px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .bar-track { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.25s ease; }

    /* QUICK CHIPS */
    .chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chips-scroll::-webkit-scrollbar { display: none; }
    .quick-chip { background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .quick-chip strong { color: var(--blue); }

    /* BUCKETS & ROWS */
    .bucket-row { background: rgba(0,0,0,0.22); border-radius: 14px; padding: 12px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.04); }
    .bucket-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
